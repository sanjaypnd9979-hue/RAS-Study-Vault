
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAS Syllabus Tracker</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

.header{
    background:linear-gradient(135deg,#0756b8,#0b8ee8);
    color:white;
    padding:30px 20px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    margin:8px 0 0;
}

.container{
    max-width:1000px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.progress-box{
    display:flex;
    align-items:center;
    gap:25px;
    flex-wrap:wrap;
}

.circle{
    width:130px;
    height:130px;
    border-radius:50%;
    background:conic-gradient(#0878dc 0%,#0878dc 0%,#e5eaf0 0%);
    display:flex;
    align-items:center;
    justify-content:center;
}

.circle-inner{
    width:100px;
    height:100px;
    background:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
}

.subject{
    border:1px solid #e1e6ee;
    border-radius:12px;
    padding:15px;
    margin:12px 0;
}

.subject-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.topic{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid #f0f0f0;
}

.topic:last-child{
    border-bottom:0;
}

input[type="checkbox"]{
    width:20px;
    height:20px;
    cursor:pointer;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
}

.stat{
    background:#f1f6fc;
    padding:18px;
    border-radius:12px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:25px;
    color:#086ac7;
}

button{
    border:0;
    background:#0878dc;
    color:white;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    margin:5px;
}

button:hover{
    background:#075ca8;
}

.reset{
    background:#d93636;
}

.home{
    text-decoration:none;
    color:white;
    display:inline-block;
    margin-top:15px;
    background:rgba(255,255,255,.18);
    padding:9px 15px;
    border-radius:8px;
}

.progress-bar{
    height:18px;
    background:#e5eaf0;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#0878dc;
    transition:.3s;
}

footer{
    text-align:center;
    padding:25px;
    color:#777;
}
</style>
</head>

<div class="header">
    <h1>📚 RAS Syllabus Tracker</h1>
    <p>RPSC RAS Preparation Dashboard</p>

    <a class="home" href="../index.html">
        ← RAS Study Vault
    </a>
</div>

                <div class="circle-inner" id="percent">
